<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUBLISHER</title>

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/assets/css/global.css">

    <!-- Paleta -->
    <style type="text/tailwindcss">
      @theme {
        --color-brand-50:  #FCE9EB;
        --color-brand-100: #F7CFD4;
        --color-brand-200: #EFA3AC;
        --color-brand-300: #E3707D;
        --color-brand-400: #D93D51;
        --color-brand-500: #CB0A0A;
        --color-brand-600: #A80E12;
        --color-brand-700: #900D0D;
        --color-brand-800: #880D1E;
        --color-brand-900: #5C0A14;

        --color-neutral-50:  #FAF8F8;
        --color-neutral-100: #F2EFEF;
        --color-neutral-200: #E8E8E8;
        --color-neutral-400: #B9B4B4;
        --color-neutral-500: #8A8585;
        --color-neutral-700: #4A4444;
        --color-neutral-900: #1A1616;

        --color-ink: #000000;
        --font-sans: Inter, system-ui, sans-serif;
      }
    </style>
</head>

<body class="min-h-screen bg-neutral-50 text-neutral-900 font-sans flex items-center justify-center p-6">

    <div class="w-full max-w-sm">

        <!-- Logo / marca -->
        <div class="flex flex-col items-center mb-8">
            <span class="text-xl font-bold text-neutral-900 tracking-wide">PUBLISHER</span>
        </div>

        <!-- Card de redefinição -->
        <div id="passo-form" class="bg-white rounded-2xl border border-neutral-200 shadow-sm p-6 space-y-5">

            <div>
                <h1 class="text-lg font-bold text-neutral-900">Criar nova senha</h1>
                <p class="text-sm text-neutral-500 mt-1">Escolha uma nova senha para sua conta.</p>
            </div>

            <!-- Alerta de erro -->
            <div id="redefinir-error" class="hidden items-center gap-2 bg-brand-50 border border-brand-200 text-brand-800 text-sm px-3 py-2.5 rounded-lg">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m0 3.75h.008M10.29 3.86 1.82 18a1.5 1.5 0 0 0 1.3 2.25h17.76a1.5 1.5 0 0 0 1.3-2.25L13.71 3.86a1.5 1.5 0 0 0-2.42 0Z"/>
                </svg>
                <span id="redefinir-error-msg">Este link expirou. Solicite um novo.</span>
            </div>

            <form id="form-redefinir" class="space-y-4" onsubmit="validarESubmeter(event)">

                <input type="hidden" id="token" name="token" value="" />

                <div>
                    <label for="nova-senha" class="text-xs font-medium text-neutral-500">Nova senha</label>
                    <div class="relative mt-1">
                        <input type="password"
                               id="nova-senha"
                               name="nova_senha"
                               required
                               autocomplete="new-password"
                               minlength="8"
                               placeholder="Mínimo 8 caracteres"
                               oninput="checarForcaSenha()"
                               class="w-full border border-neutral-200 rounded-lg px-3 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
                        <button type="button"
                                onclick="togglePassword('nova-senha', 'eye-icon-1')"
                                class="absolute right-2.5 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-700">
                            <svg id="eye-icon-1" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Indicador de força da senha -->
                    <div class="flex gap-1 mt-2">
                        <div id="forca-1" class="h-1 flex-1 rounded-full bg-neutral-200 transition-colors"></div>
                        <div id="forca-2" class="h-1 flex-1 rounded-full bg-neutral-200 transition-colors"></div>
                        <div id="forca-3" class="h-1 flex-1 rounded-full bg-neutral-200 transition-colors"></div>
                        <div id="forca-4" class="h-1 flex-1 rounded-full bg-neutral-200 transition-colors"></div>
                    </div>
                    <p id="forca-label" class="text-xs text-neutral-400 mt-1">Use letras, números e símbolos.</p>
                </div>

                <div>
                    <label for="confirmar-senha" class="text-xs font-medium text-neutral-500">Confirmar nova senha</label>
                    <div class="relative mt-1">
                        <input type="password"
                               id="confirmar-senha"
                               name="confirmar_senha"
                               required
                               autocomplete="new-password"
                               placeholder="Repita a senha"
                               class="w-full border border-neutral-200 rounded-lg px-3 py-2 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400" />
                        <button type="button"
                                onclick="togglePassword('confirmar-senha', 'eye-icon-2')"
                                class="absolute right-2.5 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-700">
                            <svg id="eye-icon-2" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                            </svg>
                        </button>
                    </div>
                    <p id="msg-confirmacao" class="text-xs text-neutral-400 mt-1">As senhas devem ser iguais.</p>
                </div>

                <button type="submit"
                        id="btn-redefinir"
                        class="w-full bg-brand-800 text-white text-sm font-semibold px-4 py-2.5 rounded-lg hover:bg-brand-700 transition-colors flex items-center justify-center gap-2">
                    <span id="btn-redefinir-text">Redefinir senha</span>
                    <svg id="btn-redefinir-spinner" class="hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Confirmação de sucesso -->
        <div id="passo-sucesso" class="hidden bg-white rounded-2xl border border-neutral-200 shadow-sm p-6 space-y-5 text-center">
            <div class="w-14 h-14 mx-auto rounded-full bg-brand-100 text-brand-700 flex items-center justify-center">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-neutral-900">Senha redefinida!</h1>
                <p class="text-sm text-neutral-500 mt-1">Sua senha foi alterada com sucesso.</p>
            </div>
            <a href="login.html"
               class="block w-full bg-brand-800 text-white text-sm font-semibold px-4 py-2.5 rounded-lg hover:bg-brand-700 transition-colors">
                Ir para o login
            </a>
        </div>

    </div>

    <script>
        // Captura o token de redefinição da URL (?token=...) e injeta no form
        const params = new URLSearchParams(window.location.search);
        document.getElementById('token').value = params.get('token') || '';

        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>';
            }
        }

        function checarForcaSenha() {
            const senha = document.getElementById('nova-senha').value;
            const barras = ['forca-1','forca-2','forca-3','forca-4'].map(id => document.getElementById(id));
            const label = document.getElementById('forca-label');
            let pontuacao = 0;
            if (senha.length >= 8) pontuacao++;
            if (/[A-Z]/.test(senha) && /[a-z]/.test(senha)) pontuacao++;
            if (/[0-9]/.test(senha)) pontuacao++;
            if (/[^A-Za-z0-9]/.test(senha)) pontuacao++;
            const cores = ['bg-neutral-200','bg-red-400','bg-yellow-400','bg-blue-500','bg-green-500'];
            const textos = ['Use letras, números e símbolos.','Fraca','Razoável','Boa','Forte'];
            barras.forEach((b, i) => {
                b.className = 'h-1 flex-1 rounded-full transition-colors ' + (i < pontuacao ? cores[pontuacao] : 'bg-neutral-200');
            });
            label.textContent = senha.length === 0 ? textos[0] : textos[pontuacao];
        }

        function mostrarErro(msg) {
            const el = document.getElementById('redefinir-error');
            document.getElementById('redefinir-error-msg').textContent = msg;
            el.classList.remove('hidden');
            el.classList.add('flex');
        }

        function esconderErro() {
            const el = document.getElementById('redefinir-error');
            el.classList.add('hidden');
            el.classList.remove('flex');
        }

        function setLoading(on) {
            const btn = document.getElementById('btn-redefinir');
            const txt = document.getElementById('btn-redefinir-text');
            const spin = document.getElementById('btn-redefinir-spinner');
            btn.disabled = on;
            txt.textContent = on ? 'Redefinindo...' : 'Redefinir senha';
            spin.classList.toggle('hidden', !on);
            btn.classList.toggle('opacity-75', on);
            btn.classList.toggle('cursor-not-allowed', on);
        }

        async function validarESubmeter(event) {
            event.preventDefault();
            esconderErro();

            const token = document.getElementById('token').value;
            const novaSenha = document.getElementById('nova-senha').value;
            const confirmar = document.getElementById('confirmar-senha').value;
            const msg = document.getElementById('msg-confirmacao');

            if (novaSenha !== confirmar) {
                msg.textContent = 'As senhas não coincidem.';
                msg.classList.remove('text-neutral-400');
                msg.classList.add('text-brand-600', 'font-medium');
                return;
            }
            msg.textContent = 'As senhas devem ser iguais.';
            msg.classList.add('text-neutral-400');
            msg.classList.remove('text-brand-600', 'font-medium');

            if (novaSenha.length < 8) {
                mostrarErro('A senha deve ter no mínimo 8 caracteres.');
                return;
            }

            if (!token) {
                mostrarErro('Link de redefinição inválido. Solicite um novo.');
                return;
            }

            setLoading(true);
            try {
                const response = await fetch('/api/auth/redefinir-senha', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: novaSenha })
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.detail || data.message || 'Erro ao redefinir senha.');
                }
                // Sucesso — mostrar tela de confirmação
                document.getElementById('passo-form').classList.add('hidden');
                document.getElementById('passo-sucesso').classList.remove('hidden');
            } catch (error) {
                mostrarErro(error.message || 'Erro ao redefinir senha. Tente novamente.');
            } finally {
                setLoading(false);
            }
        }
    </script>

</body>
</html>
